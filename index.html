<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的課表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f7f8fc;
      --card:rgba(255,255,255,.88);
      --text:#30343b;
      --muted:#8b919c;
      --line:#e8eaf0;
      --accent:#8b9cf6;
      --accent-soft:#eef0ff;
      --shadow:0 12px 35px rgba(55,65,81,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(201,211,255,.55), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(255,220,231,.5), transparent 25%),
        var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    }
    .page{max-width:1180px;margin:0 auto;padding:38px 20px 60px}
    .hero{text-align:center;margin-bottom:26px}
    .hero-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(80,90,120,.06);font-size:13px;color:#737a88;margin-bottom:12px}
    h1{font-size:34px!important;line-height:1.2;margin:0!important;letter-spacing:.02em;color:#2f3440}
    .subtitle{margin:9px 0 0;color:#9aa0aa;font-size:14px}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.95);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    .sync-card{padding:18px 20px;margin-bottom:16px}
    .sync-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .status-wrap{display:flex;align-items:center;gap:10px;min-width:0}
    #authStatus{font-weight:600;color:#505662!important;font-size:14px}
    #syncStatus{color:#9aa0aa!important;margin-top:7px!important}
    .status-dot{width:9px;height:9px;border-radius:50%;background:#c6cbd4;box-shadow:0 0 0 4px #f1f2f5;flex:none}
    .btn{border:0!important;border-radius:12px!important;padding:10px 15px!important;font-size:14px!important;font-weight:600!important;cursor:pointer;transition:.18s ease;box-shadow:none!important}
    .btn:hover{transform:translateY(-1px);filter:brightness(.98)}
    .btn-primary{background:#8999ed!important;color:white!important}
    .btn-secondary{background:#f0f1f5!important;color:#606672!important}
    .btn-green{background:#93c9af!important;color:white!important}
    .btn-yellow{background:#e9c779!important;color:white!important}
    .btn-pink{background:#dda5b9!important;color:white!important}
    .btn-purple{background:#a59be8!important;color:white!important}
    .btn-danger{background:#e79a9a!important;color:white!important}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .toolbar-left,.toolbar-right{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    #periodSummary{color:#989eaa!important;margin-left:3px!important}
    .schedule-card{padding:14px;overflow:hidden}
    #scheduleContainer{overflow-x:auto;border-radius:15px}
    #scheduleContainer table{border:0!important;border-collapse:separate!important;border-spacing:5px!important;min-width:760px;background:transparent}
    #scheduleContainer th{border:0!important;background:#f0f1f7!important;color:#626977;font-weight:700;padding:13px 10px!important;border-radius:11px!important}
    #scheduleContainer th:first-child{width:105px;background:#e9ebf3!important;color:#727886}
    #scheduleContainer td{border:0!important;background:transparent!important;border-radius:13px!important;box-shadow:none!important;transition:.18s ease;min-height:96px;padding:0!important;vertical-align:middle!important}
    #scheduleContainer td:first-child{background:#f8f9fb!important;box-shadow:none!important;color:#626976}
    #scheduleContainer td:hover{transform:translateY(-1px);box-shadow:none!important}
    #scheduleContainer td:first-child:hover{transform:none;box-shadow:none!important}
    #scheduleContainer td > div{line-height:1.5;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    #scheduleContainer td:not(:first-child) > div > div:first-child{font-weight:700;color:#454b56}
    #scheduleContainer td:not(:first-child) > div > div:nth-child(2){font-size:12px;color:#727987;margin-top:2px}
    #scheduleContainer td:not(:first-child) > div > div:nth-child(3){font-size:12px;color:#969ca7}

    .modal-backdrop{background:rgba(35,39,50,.38)!important;backdrop-filter:blur(4px)}
    .modal-box{border-radius:22px!important;border:1px solid rgba(255,255,255,.9);box-shadow:0 25px 70px rgba(30,35,50,.18);padding:23px!important;max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    #courseModal .modal-box{width:min(92vw,420px)!important;max-height:calc(100vh - 32px);overflow-y:auto}
    #periodModal .modal-box{max-height:calc(100vh - 32px);overflow-y:auto}
    .modal-backdrop{overflow-y:auto;-webkit-overflow-scrolling:touch}
    .modal-title{color:#373c47}
    .field{border:1px solid #e4e6ec!important;border-radius:11px!important;padding:10px 12px!important;outline:none;transition:.15s;border-width:1px!important}
    .field:focus{border-color:#aab5ee!important;box-shadow:0 0 0 3px #eef0ff}
    label{font-size:13px;color:#777e8a;font-weight:600}
    .period-row{background:#f8f9fb;border:1px solid #eceef3;border-radius:12px;padding:6px}
    .period-row input{background:white;border:1px solid #e5e7ec!important;border-radius:9px!important}
    .remove-period{color:#c5a0a0!important}
    .add-period{background:#fafaff!important;border-color:#d9dcf0!important;color:#8589a2!important}
    .modal-actions{border-top:1px solid #f0f1f4;padding-top:14px}
    .color-preview{border:3px solid white!important;box-shadow:0 2px 10px rgba(50,60,80,.12)}
    .background-preview{width:100%;height:74px;border-radius:15px;border:1px solid #e6e8ee;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);cursor:pointer}
    .bg-swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .bg-swatch{width:34px;height:34px;border-radius:10px;border:2px solid white;box-shadow:0 1px 6px rgba(50,60,80,.12);cursor:pointer}
    .footer-note{text-align:center;color:#b0b4bd;font-size:12px;margin-top:18px}
    .mobile-swipe-hint{display:none;text-align:center;color:#a4a9b4;font-size:10px;padding:7px 0 1px}

    /* ===== 多裝置響應式介面 ===== */
    .device-layout-note{display:none}
    @media (min-width: 1200px){
      .page{max-width:1280px;padding-left:28px;padding-right:28px}
      #scheduleContainer table{min-width:900px}
      #scheduleContainer th{padding:14px 12px!important}
      #scheduleContainer td{height:104px}
    }
    @media (min-width: 641px) and (max-width: 1024px){
      .page{padding:28px 16px 46px}
      h1{font-size:30px!important}
      .sync-card{padding:16px}
      .toolbar{gap:10px}
      .toolbar-left,.toolbar-right{gap:7px}
      .schedule-card{padding:10px}
      #scheduleContainer{overflow-x:auto;-webkit-overflow-scrolling:touch}
      #scheduleContainer table{min-width:800px;width:100%}
      #scheduleContainer th{padding:12px 8px!important}
      #scheduleContainer td{height:94px}
    }
    @media (max-width: 640px){
      /* 手機：避免桌面版內容被壓縮，課表改成可左右滑動 */
      .page{max-width:none}
      .hero{padding:0 4px}
      .sync-card{box-shadow:0 8px 24px rgba(55,65,81,.06)}
      .toolbar{position:relative}
      .schedule-card{width:100%;}
      #scheduleContainer{scrollbar-width:thin}
      #scheduleContainer table{table-layout:fixed!important}
      #scheduleContainer th:not(:first-child),
      #scheduleContainer td:not(:first-child){width:107px!important;min-width:107px!important}
      #scheduleContainer th:first-child,
      #scheduleContainer td:first-child{width:72px!important;min-width:72px!important}
      #scheduleContainer td{height:84px!important}
      /* 手機表單：輸入框與按鈕更容易點 */
      .period-row{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px!important;align-items:center}
      .period-row .remove-period{width:34px;height:40px}
    }
    @media (max-width: 480px){
      .page{padding:14px 8px 28px}
      h1{font-size:23px!important}
      .subtitle{font-size:11px}
      .hero-badge{font-size:10px}
      .sync-card{padding:11px}
      .toolbar-right .btn{min-height:40px}
      .schedule-card{padding:5px}
      #scheduleContainer table{min-width:607px!important;width:607px!important}
      #scheduleContainer th:not(:first-child),#scheduleContainer td:not(:first-child){width:107px!important;min-width:107px!important}
      #scheduleContainer th:first-child,#scheduleContainer td:first-child{width:72px!important;min-width:72px!important}
      #scheduleContainer th{font-size:11px;padding:9px 4px!important}
      #scheduleContainer td > div{padding:2px!important}
      .modal-box{padding:16px!important}
    }
    @media (max-width: 360px){
      h1{font-size:21px!important}
      .btn{font-size:11px!important}
      #scheduleContainer table{min-width:577px!important;width:577px!important}
      #scheduleContainer th:not(:first-child),#scheduleContainer td:not(:first-child){width:101px!important;min-width:101px!important}
      #scheduleContainer th:first-child,#scheduleContainer td:first-child{width:72px!important;min-width:72px!important}
    }
    @media (hover:none) and (pointer:coarse){
      #scheduleContainer td:hover{transform:none!important;box-shadow:none!important}
      .btn:hover{transform:none;filter:none}
      #scheduleContainer td{cursor:pointer}
    }
    /* 手機版：以手機 App 的閱讀方式呈現 */
    @media(max-width:640px){
      body{font-size:14px;overflow-x:hidden}
      .page{width:100%;padding:18px 10px 34px}
      .hero{margin-bottom:16px}
      .hero-badge{font-size:11px;padding:6px 11px;margin-bottom:8px}
      h1{font-size:25px!important}
      .subtitle{font-size:12px;margin-top:6px}

      .card{border-radius:18px}
      .sync-card{padding:13px;margin-bottom:12px}
      .sync-row{gap:11px}
      .status-wrap{width:100%}
      #authStatus{font-size:13px!important}
      #syncStatus{font-size:11px!important;margin-top:4px!important}
      .sync-card .toolbar-right{width:100%}
      .sync-card .btn{width:100%}

      /* 工具列改成手機兩列 */
      .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
      .toolbar-left,.toolbar-right{width:100%;display:contents}
      .toolbar-left .btn{grid-column:1 / -1}
      .toolbar-left .btn:nth-child(2){grid-column:1 / -1}
      #periodSummary{grid-column:1 / -1;margin:0!important;text-align:center;font-size:11px}
      .toolbar-right .btn{width:100%;min-width:0}
      .toolbar-right .btn:first-child{grid-column:1}
      .toolbar-right .btn:nth-child(2){grid-column:2}
      .toolbar-right .btn:nth-child(3){grid-column:1 / -1}
      .btn{min-height:42px;padding:9px 10px!important;font-size:13px!important}

      .schedule-card{padding:7px;border-radius:18px}
      .mobile-swipe-hint{display:block}
      #scheduleContainer{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:13px;padding-bottom:3px}
      #scheduleContainer table{min-width:610px!important;width:610px!important;border-spacing:3px!important}
      #scheduleContainer th{font-size:12px;padding:10px 5px!important;position:sticky;top:0;z-index:2}
      #scheduleContainer th:first-child{width:72px;min-width:72px}
      #scheduleContainer td{height:82px;min-height:82px;border-radius:10px!important}
      #scheduleContainer td:first-child{width:72px;min-width:72px;position:sticky;left:0;z-index:1;background:#f8f9fb!important;box-shadow:3px 0 8px rgba(70,80,100,.07)!important}
      #scheduleContainer td > div{padding:3px!important;line-height:1.35}
      #scheduleContainer td:not(:first-child) > div > div:first-child{font-size:12px}
      #scheduleContainer td:not(:first-child) > div > div:nth-child(2),
      #scheduleContainer td:not(:first-child) > div > div:nth-child(3){font-size:10px;margin-top:1px}
      #scheduleContainer td:not(:first-child) > div > div:first-child:first-letter{font-size:13px}

      .footer-note{font-size:10px;margin-top:12px}

      /* 手機上的兩個設定視窗改為接近全螢幕 */
      .modal-backdrop{padding:10px!important;align-items:flex-end!important}
      .modal-box{width:100%!important;max-width:none!important;border-radius:20px 20px 12px 12px!important;padding:18px!important;max-height:calc(100vh - 20px)!important;overflow-y:auto!important}
      #courseModal .modal-box{max-height:calc(100vh - 20px)!important;overflow-y:auto!important}
      #courseModal .flex.flex-col{gap:9px!important}
      .field{min-height:43px;font-size:14px!important}
      .modal-actions{position:sticky;bottom:0;background:rgba(255,255,255,.96);margin-left:-18px;margin-right:-18px;margin-bottom:-18px;padding:12px 18px 18px;z-index:2;backdrop-filter:blur(8px)}
      #colorModal .modal-box{width:auto!important;max-width:330px!important;align-self:center!important}
      #colorPicker{max-width:100%}

      /* 節次編輯列在手機上改成較容易點擊的版型 */
      .period-row{padding:7px!important;gap:5px!important}
      .period-row input{min-height:40px!important;font-size:13px!important}
    }

    @media(max-width:380px){
      .page{padding-left:7px;padding-right:7px}
      #scheduleContainer table{min-width:570px!important;width:570px!important}
      #scheduleContainer th:first-child,#scheduleContainer td:first-child{width:66px;min-width:66px}
      .btn{font-size:12px!important}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="hero-badge">✨ 我的專屬課表</div>
      <h1>我的課表</h1>
      <p class="subtitle">上課啦啊啊啊～你排課表了ㄇ(´･ω･`)?</p>
    </header>

    <section class="card sync-card">
      <div class="sync-row">
        <div class="status-wrap">
          <span class="status-dot"></span>
          <div>
            <div id="authStatus">☁️ 尚未登入</div>
            <div id="syncStatus" class="text-sm">登入後即可跨裝置同步課表</div>
          </div>
        </div>
        <div class="toolbar-right">
          <button id="loginBtn" onclick="loginWithGoogle()" class="btn btn-primary">Google 登入</button>
          <button id="logoutBtn" onclick="logout()" class="btn btn-secondary hidden">登出</button>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-left">
        <button onclick="openPeriodModal()" class="btn btn-purple">⚙️ 節次設定</button>
        <button onclick="openBackgroundModal()" class="btn btn-secondary">🎨 課表背景</button>
        <span id="periodSummary">尚未設定節次</span>
      </div>
      <div class="toolbar-right">
        <button onclick="saveSchedule()" class="btn btn-green">💾 儲存</button>
        <button onclick="downloadPDF()" class="btn btn-yellow">📄 PDF</button>
        <button onclick="downloadImage()" class="btn btn-pink">🖼️ 圖片</button>
      </div>
    </section>

    <section class="card schedule-card">
      <div id="scheduleContainer"></div>
      <div class="mobile-swipe-hint">← 左右滑動查看完整課表 →</div>
    </section>

    <div class="footer-note">點一下課表格子，就可以新增或編輯課程 ✦</div>
  </main>

  <!-- 節次設定 Modal -->
  <div id="periodModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-20 modal-backdrop">
    <div class="bg-white p-6 rounded-lg w-[95%] max-w-lg max-h-[90vh] overflow-y-auto modal-box">
      <h2 class="text-xl font-bold mb-2 modal-title">⚙️ 節次設定</h2>
      <p class="text-sm text-gray-500 mb-4">可以直接輸入節次名稱和時間，順序就是課表顯示順序。</p>
      <div id="periodEditor" class="flex flex-col gap-2"></div>
      <button onclick="addPeriodRow()" class="mt-3 border border-dashed border-gray-400 rounded p-2 w-full add-period">＋ 新增節次</button>
      <div class="flex justify-end gap-2 mt-4 modal-actions">
        <button onclick="closePeriodModal()" class="btn btn-secondary">取消</button>
        <button onclick="savePeriodsFromModal()" class="btn btn-purple">儲存節次</button>
      </div>
    </div>
  </div>

  <!-- 新增/編輯課程 Modal -->
  <div id="courseModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-20 modal-backdrop">
    <div class="bg-white p-6 rounded-lg w-96 modal-box">
      <h2 class="text-xl font-bold mb-4 modal-title" id="modalTitle">新增課程</h2>
      <div class="flex flex-col gap-3">
        <input id="courseEmoji" type="text" placeholder="Emoji，例如 📘" class="field w-full" />
        <input id="courseName" type="text" placeholder="課程名稱" class="field w-full" />
        <input id="courseTeacher" type="text" placeholder="授課教師" class="field w-full" />
        <input id="courseLocation" type="text" placeholder="教室地點" class="field w-full" />

        <label>星期
          <select id="courseDay" class="field w-full"></select>
        </label>
        <label>開始節次
          <select id="courseStart" class="field w-full"></select>
        </label>
        <label>結束節次
          <select id="courseEnd" class="field w-full"></select>
        </label>

        <div>
          <label class="block mb-2">課程顏色</label>
          <div id="colorPreview" class="w-10 h-10 rounded-xl cursor-pointer color-preview" style="background:#a0e7e5"></div>
          <input id="colorHex" type="text" class="field w-full mt-2" placeholder="#A0E7E5" />
          <div id="recentColors" class="flex gap-2 mt-2"></div>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-5 modal-actions">
        <button onclick="closeModal()" class="btn btn-secondary">取消</button>
        <button id="deleteBtn" onclick="deleteCourseInModal()" class="btn btn-danger hidden">刪除</button>
        <button onclick="saveCourse()" class="btn btn-primary">確認</button>
      </div>
    </div>
  </div>

  <!-- 課表背景設定 Modal -->
  <div id="backgroundModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-30 modal-backdrop">
    <div class="bg-white p-6 rounded-lg w-[92%] max-w-sm modal-box">
      <h2 class="text-xl font-bold mb-2 modal-title">🎨 課表背景</h2>
      <p class="text-sm text-gray-500 mb-4">設定整張課表的背景顏色，課程本身的顏色不會被改變。</p>
      <div id="backgroundPreview" class="background-preview mb-4"></div>
      <div class="flex items-center gap-3">
        <input id="backgroundColor" type="color" value="#ffffff" class="w-12 h-11 p-1 rounded-xl border border-gray-200 cursor-pointer" />
        <input id="backgroundHex" type="text" value="#ffffff" placeholder="#F7F8FC" class="field flex-1" />
      </div>
      <div class="bg-swatches">
        <button type="button" class="bg-swatch" style="background:#ffffff" onclick="setBackgroundColor('#ffffff')" title="白色"></button>
        <button type="button" class="bg-swatch" style="background:#f7f8fc" onclick="setBackgroundColor('#f7f8fc')" title="霧白"></button>
        <button type="button" class="bg-swatch" style="background:#eef2ff" onclick="setBackgroundColor('#eef2ff')" title="淡紫藍"></button>
        <button type="button" class="bg-swatch" style="background:#eefaf4" onclick="setBackgroundColor('#eefaf4')" title="淡綠"></button>
        <button type="button" class="bg-swatch" style="background:#fff7e8" onclick="setBackgroundColor('#fff7e8')" title="淡黃"></button>
        <button type="button" class="bg-swatch" style="background:#fff0f5" onclick="setBackgroundColor('#fff0f5')" title="淡粉"></button>
        <button type="button" class="bg-swatch" style="background:#f3efff" onclick="setBackgroundColor('#f3efff')" title="淡紫"></button>
      </div>
      <div class="flex justify-end gap-2 mt-5 modal-actions">
        <button onclick="closeBackgroundModal()" class="btn btn-secondary">取消</button>
        <button onclick="saveBackground()" class="btn btn-primary">套用背景</button>
      </div>
    </div>
  </div>

  <!-- 顏色挑選器彈窗 -->
  <div id="colorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-30 modal-backdrop">
    <div class="bg-white p-4 rounded-lg modal-box">
      <div id="colorPicker"></div>
      <div class="flex justify-end mt-4">
        <button onclick="closeColorModal()" class="btn btn-primary">完成</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
