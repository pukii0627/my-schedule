<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>我的課表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-6 max-w-5xl mx-auto">
  <h1 class="text-2xl font-bold mb-4 text-center">📅 我的課表</h1>

  <!-- 雲端同步 / 登入 -->
  <div class="mb-6 p-4 rounded-lg border bg-gray-50">
    <div class="flex flex-wrap items-center gap-2">
      <span id="authStatus" class="text-gray-600">☁️ 尚未登入</span>
      <button id="loginBtn" onclick="loginWithGoogle()" class="bg-blue-600 text-white rounded p-2 hover:bg-blue-700">
        使用 Google 登入
      </button>
      <button id="logoutBtn" onclick="logout()" class="bg-gray-500 text-white rounded p-2 hover:bg-gray-600 hidden">
        登出
      </button>
    </div>
    <div id="syncStatus" class="text-sm text-gray-500 mt-2">登入後即可跨裝置同步課表</div>
  </div>

  <!-- 節次設定區 -->
  <div class="mb-6">
    <button onclick="openPeriodModal()" class="bg-purple-500 text-white rounded p-2 hover:bg-purple-600">
      ⚙️ 節次設定
    </button>
    <span id="periodSummary" class="ml-2 text-sm text-gray-500"></span>
  </div>

  <!-- 節次設定 Modal -->
  <div id="periodModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-20">
    <div class="bg-white p-6 rounded-lg w-[95%] max-w-lg max-h-[90vh] overflow-y-auto">
      <h2 class="text-xl font-bold mb-2">⚙️ 節次設定</h2>
      <p class="text-sm text-gray-500 mb-4">
        可以直接輸入節次名稱和時間，順序就是課表顯示順序ㄛ。
      </p>
      <div id="periodEditor" class="flex flex-col gap-2"></div>
      <button onclick="addPeriodRow()" class="mt-3 border border-dashed border-gray-400 rounded p-2 w-full hover:bg-gray-50">
        ＋ 新增節次
      </button>
      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closePeriodModal()" class="bg-gray-400 text-white rounded p-2">取消</button>
        <button onclick="savePeriodsFromModal()" class="bg-purple-500 text-white rounded p-2 hover:bg-purple-600">
          儲存節次
        </button>
      </div>
    </div>
  </div>

  <!-- 功能按鈕 -->
  <div class="mb-6 flex flex-wrap gap-2">
    <button onclick="saveSchedule()" class="bg-green-500 text-white rounded p-2 hover:bg-green-600">💾 存檔</button>
    <button onclick="downloadPDF()" class="bg-yellow-500 text-white rounded p-2 hover:bg-yellow-600">📥 下載 PDF</button>
    <button onclick="downloadImage()" class="bg-pink-500 text-white rounded p-2 hover:bg-pink-600">📸 存相簿圖片</button>
  </div>

  <!-- 課表顯示 -->
  <div id="scheduleContainer" class="overflow-x-auto"></div>

  <!-- 新增/編輯課程 Modal -->
  <div id="courseModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-20">
    <div class="bg-white p-6 rounded-lg w-96">
      <h2 class="text-xl font-bold mb-4" id="modalTitle">新增課程</h2>
      <div class="flex flex-col gap-2">
        <input id="courseEmoji" type="text" placeholder="Emoji (例如 📘)" class="border p-2 rounded w-full" />
        <input id="courseName" type="text" placeholder="課程名稱" class="border p-2 rounded w-full" />
        <input id="courseTeacher" type="text" placeholder="授課教師" class="border p-2 rounded w-full" />
        <input id="courseLocation" type="text" placeholder="教室地點" class="border p-2 rounded w-full" />

        <label>星期
          <select id="courseDay" class="border p-2 rounded w-full"></select>
        </label>
        <label>開始節次
          <select id="courseStart" class="border p-2 rounded w-full"></select>
        </label>
        <label>結束節次
          <select id="courseEnd" class="border p-2 rounded w-full"></select>
        </label>

        <!-- 顏色選擇器 -->
        <div>
          <label class="block mb-1">課程顏色</label>
          <div id="colorPreview" class="w-10 h-10 border rounded cursor-pointer" style="background:#a0e7e5"></div>
          <input id="colorHex" type="text" class="border p-2 rounded w-full mt-2" />
          <div id="recentColors" class="flex gap-1 mt-2"></div>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeModal()" class="bg-gray-400 text-white rounded p-2">取消</button>
        <button id="deleteBtn" onclick="deleteCourseInModal()" class="bg-red-500 text-white rounded p-2 hidden">刪除</button>
        <button onclick="saveCourse()" class="bg-blue-500 text-white rounded p-2 hover:bg-blue-600">確認</button>
      </div>
    </div>
  </div>

  <!-- 顏色挑選器彈窗 -->
  <div id="colorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-30">
    <div class="bg-white p-4 rounded-lg">
      <div id="colorPicker"></div>
      <div class="flex justify-end mt-4">
        <button onclick="closeColorModal()" class="bg-blue-500 text-white px-4 py-2 rounded">完成</button>
      </div>
    </div>
  </div>

<script src="./app.js"></script>

</body>
</html>
